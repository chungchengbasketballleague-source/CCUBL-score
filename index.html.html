function openRecordGameModal(){
    const s=season(); const eo=s.divisions.east.length>=2, wo=s.divisions.west.length>=2;
    if(!eo&&!wo){ alert('請先為至少一個分區新增至少兩支球隊。'); return; }
    const divSel=document.getElementById('game-division');
    divSel.value=eo?'east':'west';
    Array.from(divSel.options).forEach(opt=>{ opt.disabled=s.divisions[opt.value].length<2; });
    document.getElementById('record-game-error').textContent='';
    document.getElementById('score1').value=''; document.getElementById('score2').value='';
    onDivisionChange();
    document.getElementById('record-game-modal').classList.add('active');
}

function onDivisionChange(){
    const div=document.getElementById('game-division').value;
    const teams=season().divisions[div];
    document.getElementById('game-team1').innerHTML=teams.map(t=>`<option value="${t.id}">${escHtml(t.name)}</option>`).join('');
    refreshTeam2();
}
function refreshTeam2(){
    const div=document.getElementById('game-division').value;
    const t1=document.getElementById('game-team1').value;
    document.getElementById('game-team2').innerHTML=season().divisions[div].filter(t=>t.id!==t1).map(t=>`<option value="${t.id}">${escHtml(t.name)}</option>`).join('');
}

// Playoff Matchup Modal
function openMatchupModal(type, index){
    const po=ensurePlayoff();
    let t1id=null,t2id=null,seed1='',seed2='',title='',existScore1=null,existScore2=null;

    if(type==='r1'){
        const m=po.round1[index];
        t1id=m.team1Id; t2id=m.team2Id; seed1=m.team1Seed; seed2=m.team2Seed;
        existScore1=m.score1; existScore2=m.score2;
        title=`第一輪 ── 第${index+1}場`;
    } else if(type==='semi'){
        const stA=getR2Standings('A'),stB=getR2Standings('B');
        if(index===0){ t1id=stA[0]?.id||null; t2id=stB[1]?.id||null; seed1='A區 第1'; seed2='B區 第2'; }
        else{ t1id=stA[1]?.id||null; t2id=stB[0]?.id||null; seed1='A區 第2'; seed2='B區 第1'; }
        const m=po.semis[index];
        existScore1=m?.score1??null; existScore2=m?.score2??null;
        title=`四強 ── 第${index+1}場`;
    } else if(type==='finals'){
        const s1=po.semis[0],s2=po.semis[1];
        t1id=s1&&s1.score1!==null?(s1.score1>s1.score2?s1.team1Id:s1.team2Id):null;
        t2id=s2&&s2.score1!==null?(s2.score1>s2.score2?s2.team1Id:s2.team2Id):null;
        seed1='四強第1場勝者'; seed2='四強第2場勝者';
        existScore1=po.finals?.score1??null; existScore2=po.finals?.score2??null;
        title='冠軍賽';
    } else if(type==='thirdplace'){
        const s1=po.semis[0],s2=po.semis[1];
        t1id=s1&&s1.score1!==null?(s1.score1>s1.score2?s1.team2Id:s1.team1Id):null;
        t2id=s2&&s2.score1!==null?(s2.score1>s2.score2?s2.team2Id:s2.team1Id):null;
        seed1='四強第1場敗者'; seed2='四強第2場敗者';
        existScore1=po.thirdPlace?.score1??null; existScore2=po.thirdPlace?.score2??null;
        title='季軍賽';
    }

    if(!t1id&&!t2id){ alert('對戰隊伍尚未決定，請先完成前一輪賽事。'); return; }

    mmCtx={ type, index, team1Id:t1id, team2Id:t2id, seed1, seed2 };
    document.getElementById('mm-title').textContent=title;
    document.getElementById('mm-seed1').textContent=seed1;
    document.getElementById('mm-name1').textContent=t1id?(getTeam(t1id)?.name||'?'):'待定';
    document.getElementById('mm-name1').className='mm-name'+(t1id?'':' pending');
    document.getElementById('mm-seed2').textContent=seed2;
    document.getElementById('mm-name2').textContent=t2id?(getTeam(t2id)?.name||'?'):'待定';
    document.getElementById('mm-name2').className='mm-name'+(t2id?'':' pending');
    document.getElementById('mm-score1').value=existScore1!==null?existScore1:'';
    document.getElementById('mm-score2').value=existScore2!==null?existScore2:'';
    document.getElementById('mm-error').textContent='';
    document.getElementById('matchup-modal').classList.add('active');
    setTimeout(()=>document.getElementById('mm-score1').focus(),80);
}

function openPlayInModal(div, idx){
    const po=ensurePlayoff();
    const m=po.playIn[div][idx];
    const t1id=m.team1Id, t2id=m.team2Id;
    if(!t1id&&!t2id){ alert('附加賽對戰隊伍尚未決定。'); return; }
    mmCtx={ type:'playin', div, idx, team1Id:t1id, team2Id:t2id, seed1:m.team1Seed, seed2:m.team2Seed };
    document.getElementById('mm-title').textContent=`附加賽 ── ${div==='east'?'東區':'西區'}第${idx===0?7:8}種子賽`;
    document.getElementById('mm-seed1').textContent=m.team1Seed||'';
    document.getElementById('mm-name1').textContent=t1id?(getTeam(t1id)?.name||'?'):'待定';
    document.getElementById('mm-name1').className='mm-name'+(t1id?'':' pending');
    document.getElementById('mm-seed2').textContent=m.team2Seed||'';
    document.getElementById('mm-name2').textContent=t2id?(getTeam(t2id)?.name||'?'):'待定';
    document.getElementById('mm-name2').className='mm-name'+(t2id?'':' pending');
    document.getElementById('mm-score1').value=m.score1!==null?m.score1:'';
    document.getElementById('mm-score2').value=m.score2!==null?m.score2:'';
    document.getElementById('mm-error').textContent='';
    document.getElementById('matchup-modal').classList.add('active');
    setTimeout(()=>document.getElementById('mm-score1').focus(),80);
}

// When a play-in game is scored, patch the Round 1 slot whose seed label matches the winner's new seed
function applyPlayInWinner(div, idx, winnerId){
    const po=ensurePlayoff();
    const seedNum=idx===0?7:8;
    const seedLabel=(div==='east'?'東':'西')+seedNum;
    po.round1.forEach(m=>{
        if(div==='east'&&m.team1Seed===seedLabel&&m.team1Id!==winnerId){ m.team1Id=winnerId; m.score1=null; m.score2=null; }
        if(div==='west'&&m.team2Seed===seedLabel&&m.team2Id!==winnerId){ m.team2Id=winnerId; m.score1=null; m.score2=null; }
    });
}

// Round 1 manual team-change modal
function buildTeamOptions(selectedId){
    const s=season();
    const divName={east:'東區',west:'西區'};
    let html=`<option value="">－ 待定（空） －</option>`;
    for(const div of ['east','west']){
        const teams=s.divisions[div];
        if(!teams.length) continue;
        html+=`<optgroup label="${divName[div]}">`;
        for(const t of teams) html+=`<option value="${t.id}"${t.id===selectedId?' selected':''}>${escHtml(t.name)}</option>`;
        html+=`</optgroup>`;
    }
    return html;
}
function findSeedLabel(teamId){
    if(!teamId) return '';
    for(const div of ['east','west']){
        const idx=getStandings(div).findIndex(t=>t.id===teamId);
        if(idx!==-1) return (div==='east'?'東':'西')+(idx+1);
    }
    return '';
}
function openR1TeamModal(index){
    const po=ensurePlayoff();
    const m=po.round1[index];
    r1tCtx={index};
    document.getElementById('r1t-title').textContent=`調整對戰球隊 ── 第一輪 第${index+1}場`;
    document.getElementById('r1t-team1').innerHTML=buildTeamOptions(m.team1Id);
    document.getElementById('r1t-team2').innerHTML=buildTeamOptions(m.team2Id);
    document.getElementById('r1t-error').textContent='';
    document.getElementById('r1-team-modal').classList.add('active');
}
function submitR1TeamChange(){
    if(!r1tCtx) return;
    const err=document.getElementById('r1t-error');
    const v1=document.getElementById('r1t-team1').value||null;
    const v2=document.getElementById('r1t-team2').value||null;
    if(v1&&v2&&v1===v2){ err.textContent='不能選擇相同球隊'; return; }
    const po=ensurePlayoff();
    const m=po.round1[r1tCtx.index];
    const changed=m.team1Id!==v1||m.team2Id!==v2;
    if(changed&&(m.score1!==null||m.score2!==null)){
        if(!confirm('更換球隊將清除此場次已輸入的比分，確定要繼續嗎？')) return;
        m.score1=null; m.score2=null;
    }
    m.team1Id=v1; m.team2Id=v2;
    m.team1Seed=v1?findSeedLabel(v1):'';
    m.team2Seed=v2?findSeedLabel(v2):'';
    saveState(); closeModal('r1-team-modal'); renderAll();
}

function addTeam(){
    const name=document.getElementById('team-name-input').value.trim();
    const err=document.getElementById('add-team-error');
    if(!name){ err.textContent='請輸入球隊名稱'; return; }
    if(season().divisions[addingDivision].some(t=>t.name===name)){ err.textContent='此球隊名稱已存在'; return; }
    season().divisions[addingDivision].push({id:genId(),name});
    saveState(); closeModal('add-team-modal'); renderAll();
}

// Check whether a team already appears anywhere in the generated playoff bracket
function isTeamInPlayoff(po, teamId){
    if(!po||!po.generated) return false;
    if((po.round1||[]).some(m=>m.team1Id===teamId||m.team2Id===teamId)) return true;
    if(po.playIn){
        for(const div of ['east','west']){
            if((po.playIn[div]||[]).some(m=>m.team1Id===teamId||m.team2Id===teamId)) return true;
        }
    }
    if(po.round2){
        for(const grp of ['A','B']){
            if((po.round2[grp]?.games||[]).some(g=>g.team1Id===teamId||g.team2Id===teamId)) return true;
        }
    }
    if((po.semis||[]).some(m=>m&&(m.team1Id===teamId||m.team2Id===teamId))) return true;
    if(po.finals&&(po.finals.team1Id===teamId||po.finals.team2Id===teamId)) return true;
    if(po.thirdPlace&&(po.thirdPlace.team1Id===teamId||po.thirdPlace.team2Id===teamId)) return true;
    return false;
}

function deleteTeam(division, teamId){
    const team=getTeam(teamId);
    const name=team?team.name:'此球隊';
    if(isTeamInPlayoff(season().playoff, teamId)){
        alert(`「${name}」已出現在季後賽對戰組合中，請先重新產生或調整季後賽對戰後再刪除此球隊。`);
        return;
    }
    const gameCount=season().games.filter(g=>g.team1Id===teamId||g.team2Id===teamId).length;
    const msg=gameCount>0
        ? `確定要刪除「${name}」嗎？這也會一併刪除該隊的 ${gameCount} 場例行賽比賽紀錄，此動作無法復原。`
        : `確定要刪除「${name}」嗎？此動作無法復原。`;
    if(!confirm(msg)) return;
    season().divisions[division]=season().divisions[division].filter(t=>t.id!==teamId);
    season().games=season().games.filter(g=>g.team1Id!==teamId&&g.team2Id!==teamId);
    saveState(); renderAll();
}

function recordGame(){
    const division=document.getElementById('game-division').value;
    const t1=document.getElementById('game-team1').value, t2=document.getElementById('game-team2').value;
    const s1r=document.getElementById('score1').value, s2r=document.getElementById('score2').value;
    const err=document.getElementById('record-game-error');
    if(!t1||!t2){ err.textContent='請確認已選擇兩支球隊'; return; }
    if(t1===t2){ err.textContent='不能選擇相同球隊'; return; }
    if(s1r===''||s2r===''){ err.textContent='請輸入雙方比分'; return; }
    const score1=parseInt(s1r),score2=parseInt(s2r);
    if(isNaN(score1)||isNaN(score2)||score1<0||score2<0){ err.textContent='請輸入有效的分數'; return; }
    if(score1===score2){ err.textContent='籃球沒有平局，比分不可相同'; return; }
    season().games.push({id:genId(),division,team1Id:t1,team2Id:t2,score1,score2,date:new Date().toISOString()});
    saveState(); closeModal('record-game-modal'); renderAll();
}

function deleteGame(id){
    if(!confirm('確定要刪除此場比賽紀錄？')) return;
    season().games=season().games.filter(g=>g.id!==id);
    saveState(); renderAll();
}

// Generate playoff bracket from regular season standings
function generateBracket(){
    const fmt=getPlayoffFormat();
    const east=getStandings('east');
    const west=getStandings('west');
    const po=ensurePlayoff();
    if(po.generated&&!confirm('確定要重新產生季後賽對戰組合？這將清除現有的季後賽資料。')) return;
    // Reset
    po.generated=false; po.round1=[];
    po.round2={ A:{ games:[] }, B:{ games:[] } };
    po.semis=[null,null]; po.finals=null; po.thirdPlace=null; po.playIn=null;

    if(fmt==='playin'){
        // 各區前6名直接晉級；第7~10名打附加賽決定第7、8種子
        po.playIn={
            east:[
                { id:genId(), team1Id:east[6]?.id||null, team1Seed:'東7', team2Id:east[9]?.id||null, team2Seed:'東10', score1:null, score2:null },
                { id:genId(), team1Id:east[7]?.id||null, team1Seed:'東8', team2Id:east[8]?.id||null, team2Seed:'東9', score1:null, score2:null },
            ],
            west:[
                { id:genId(), team1Id:west[6]?.id||null, team1Seed:'西7', team2Id:west[9]?.id||null, team2Seed:'西10', score1:null, score2:null },
                { id:genId(), team1Id:west[7]?.id||null, team1Seed:'西8', team2Id:west[8]?.id||null, team2Seed:'西9', score1:null, score2:null },
            ],
        };
        for(let i=0;i<8;i++){
            const eastSeed=i+1, westSeed=8-i;
            const t1=eastSeed<=6?(east[eastSeed-1]?.id||null):null;
            const t2=westSeed<=6?(west[westSeed-1]?.id||null):null;
            po.round1.push({ id:genId(), team1Id:t1, team1Seed:`東${eastSeed}`, team2Id:t2, team2Seed:`西${westSeed}`, score1:null, score2:null });
        }
    } else {
        for(let i=0;i<8;i++){
            const e=east[i]||null, w=west[7-i]||null;
            po.round1.push({ id:genId(), team1Id:e?e.id:null, team1Seed:`東${i+1}`, team2Id:w?w.id:null, team2Seed:`西${8-i}`, score1:null, score2:null });
        }
    }
    po.generated=true;
    saveState();
    view.mode='playoff'; view.round = fmt==='playin' ? 'playin' : 'round1';
    renderAll();
}

function submitMatchupScore(){
    if(!mmCtx){ closeModal('matchup-modal'); return; }
    const s1r=document.getElementById('mm-score1').value, s2r=document.getElementById('mm-score2').value;
    const err=document.getElementById('mm-error');
    if(s1r===''||s2r===''){ err.textContent='請輸入雙方比分'; return; }
    const score1=parseInt(s1r),score2=parseInt(s2r);
    if(isNaN(score1)||isNaN(score2)||score1<0||score2<0){ err.textContent='請輸入有效的分數'; return; }
    if(score1===score2){ err.textContent='籃球沒有平局，比分不可相同'; return; }
    const po=ensurePlayoff();
    if(mmCtx.type==='r1'){
        po.round1[mmCtx.index].score1=score1; po.round1[mmCtx.index].score2=score2;
    } else if(mmCtx.type==='semi'){
        po.semis[mmCtx.index]={ team1Id:mmCtx.team1Id, team2Id:mmCtx.team2Id, score1, score2 };
    } else if(mmCtx.type==='finals'){
        po.finals={ team1Id:mmCtx.team1Id, team2Id:mmCtx.team2Id, score1, score2 };
    } else if(mmCtx.type==='thirdplace'){
        po.thirdPlace={ team1Id:mmCtx.team1Id, team2Id:mmCtx.team2Id, score1, score2 };
    } else if(mmCtx.type==='playin'){
        const slot=po.playIn[mmCtx.div][mmCtx.idx];
        slot.score1=score1; slot.score2=score2;
        const winnerId=score1>score2?slot.team1Id:slot.team2Id;
        applyPlayInWinner(mmCtx.div, mmCtx.idx, winnerId);
    }
    saveState(); closeModal('matchup-modal'); renderAll();
}

function exportViewerHtml(){
    const btn = document.querySelector('#share-modal .btn-primary');
    btn.textContent = '產生中…'; btn.disabled = true;

    try {
        // Read viewer template embedded in this page (no fetch needed - works with file://)
        let html = document.getElementById('viewer-tpl').textContent;

        // Safely encode state data (escape script-closing tags inside JSON strings)
        const safeData = JSON.stringify(state).replace(/<\/script>/gi, '<\\/script>');

        // Inject baked state right after <head> — always present, no placeholder needed
        html = html.replace('<head>', '<head><script>window.__bakedState=' + safeData + ';<\/script>');

        // Restore the closing script tag from placeholder
        html = html.replace('VIEWER_SCRIPT_END', '<\/script>');

        const blob = new Blob([html], { type: 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const d = new Date();
        const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
        a.download = '聯盟賽戰績_' + state.currentSeason + '_' + stamp + '.htm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);

        btn.textContent = '已下載！'; btn.disabled = false;
        setTimeout(()=>{ btn.textContent = '產生球員版網頁'; }, 2000);
    } catch(e) {
        alert('產生失敗：' + e.message);
        btn.textContent = '產生球員版網頁'; btn.disabled = false;
    }
}

        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    } catch(e) {
        alert('匯出失敗：' + e.message);
    }
}

function importBackup(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        try{
            const data = JSON.parse(e.target.result);
            if(!data || typeof data !== 'object' || !data.seasons || !data.currentSeason){
                alert('檔案格式不正確，無法匯入。');
                return;
            }
            if(!confirm('匯入備份將會覆蓋目前所有資料，確定要繼續嗎？')) return;
            state = data;
            saveState();
            view = { mode:'regular', round:'round1' };
            renderAll();
            alert('匯入成功！');
        } catch(err){
            alert('匯入失敗：檔案格式錯誤（' + err.message + '）');
        } finally {
            event.target.value = '';
        }
    };
    reader.readAsText(file);
}

// ============================================================
//  INIT
// ============================================================
loadState();
renderAll();
</script>
